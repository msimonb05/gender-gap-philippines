<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapping Gender Parity in the Philippines</title>
<script>
let theme = null;
try { theme = localStorage.getItem("theme"); } catch (e) {}
document.documentElement.dataset.bsTheme = theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='report.css') }}">
</head>
<body>
<a class="visually-hidden-focusable" href="#report">Skip to report</a>
<nav class="navbar sticky-top border-bottom site-bar">
  <div class="container-xl">
    <a class="navbar-brand fs-6 fw-semibold" href="#">Gender Parity in the Philippines</a>
    <button id="theme-toggle" class="btn btn-sm btn-outline-secondary" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun d-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</nav>
<div class="container-xl">
  <div class="row">
    <aside class="col-lg-3 py-4">
      <nav id="toc" class="toc nav flex-column" aria-label="Contents">
        {% for h2 in toc %}
        <a class="nav-link" href="#{{ h2.id }}">{{ h2.name }}</a>
        {% for h3 in h2.children %}
        <a class="nav-link sub" href="#{{ h3.id }}">{{ h3.name }}</a>
        {% endfor %}
        {% endfor %}
      </nav>
    </aside>
    <main id="report" class="col-lg-9 py-4 report" tabindex="-1">
      {{ content | safe }}
    </main>
  </div>
</div>
<script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='report.js') }}"></script>
</body>
</html>
