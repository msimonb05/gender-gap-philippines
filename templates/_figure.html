<figure class="card figure-card my-4">
  <div class="card-body">
    <p class="fw-semibold mb-0">{{ number }}</p>
    <p class="fst-italic mb-3">{{ title }}</p>
    <img class="img-fluid w-100 d-print-none" data-chart="{{ src }}" src="{{ src }}light.svg" alt="{{ alt }}">
    <img class="img-fluid w-100 d-none d-print-block" src="{{ src }}light.svg" alt="{{ alt }}">
    <figcaption class="small mt-3"><em>Note.</em>{{ note | safe }}</figcaption>
    <a class="btn btn-sm btn-outline-secondary mt-3 me-2" data-chart-link="{{ src }}" href="{{ src }}light.svg" target="_blank" rel="noopener">Open image in new tab</a>
    <button class="btn btn-sm btn-outline-secondary mt-3" type="button" data-bs-toggle="collapse" data-bs-target="#data-{{ stem }}" aria-expanded="false" aria-controls="data-{{ stem }}" data-show-text="Show data" data-hide-text="Hide data">Show data</button>
    <div class="collapse mt-3" id="data-{{ stem }}">
      {% for name, table in tables.items() %}
      <p class="small fw-semibold mb-1">{{ name }}.csv</p>
      <div class="table-responsive data-table mb-3">{{ table | safe }}</div>
      {% endfor %}
    </div>
  </div>
</figure>
